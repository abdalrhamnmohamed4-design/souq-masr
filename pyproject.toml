[project]
name = "souq_masr"
authors = [{ name = "Souq Masr" }]
description = "Marketplace, Jobs, and Services layer for ERPNext — custom Frappe app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Required by Frappe Cloud's validate_app_dependencies() when this app is added
# to a bench — without this section Frappe Cloud has no way to check this app
# is actually compatible with the Frappe/ERPNext version on that bench, and
# app-add can fail or silently install against an incompatible framework.
#
# Set to the version-15 range (DEPLOYMENT.md's documented alternative to v16):
# the live Hostinger VPS deploy (bare-metal, Ubuntu 22.04) uses v15 because
# ERPNext version-16 itself requires Python >=3.14, which isn't available on
# 22.04 by default — v15 needs only Python >=3.10, matching the box's actual
# python3.10. If a future bench moves to v16 (e.g. on Frappe Cloud, which
# provisions its own Python per version), change this back to
# ">=16.21.0,<17.0.0" first.
[tool.bench.frappe-dependencies]
frappe = ">=15.111.0,<16.0.0"

[tool.bench.dev-dependencies]
